<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>bplist00 OLED Editor PRO</title>
    
    <!-- Подключаем шрифт Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- CodeMirror ЦП -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/search/searchcursor.min.js"></script>

    <style>
        :root {
            --bg-color: #000000; /* Чистый OLED черный */
            --panel-bg: #09090b;  /* Глубокий серый для панелей */
            --accent-pink: #d946ef;
            --accent-purple: #8b5cf6;
            --text-color: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Montserrat', sans-serif;
        }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            overflow: hidden; 
            position: fixed; 
        }
        
        .app-container { 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: -webkit-fill-available; 
        }
        
        /* Верхний Тулбар */
        .toolbar { 
            background-color: var(--panel-bg); 
            padding: 12px 16px; 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: space-between; 
            border-bottom: 1px solid var(--border-color); 
            gap: 10px; 
            z-index: 10; 
        }
        
        .btn-group { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        
        .btn { 
            background-color: #18181b; 
            color: #ffffff; 
            border: 1px solid var(--border-color); 
            padding: 10px 14px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer;  white-space: nowrap; transition: all 0.2s ease;
        }
        
        .btn:active { 
            transform: scale(0.96); 
            border-color: var(--accent-pink); 
        }
        
        .btn-primary { 
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink)); 
            border: none; 
            color: #ffffff; 
        }
        
        #file-input { display: none; }
        
        .filename-input { 
            background-color: #121214; 
            border: 1px solid var(--border-color); 
            color: #fff; 
            padding: 9px 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 400; 
            width: 140px; 
            outline: none; 
            text-overflow: ellipsis; 
        }
        
        .filename-input:focus { 
            border-color: var(--accent-purple); 
        }
        
        /* Панель Поиска */
        .search-panel { 
            background-color: var(--panel-bg); 
            padding: 10px 16px; 
            border-bottom: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        .search-row { display: flex; gap: 8px; position: relative; }
        .search-input-wrapper { flex: 1; position: relative; display: flex; align-items: center; }
        
        .search-input { 
            width: 100%; 
            background-color: #121214; 
            border: 1px solid var(--border-color); 
            color: #fff; 
            padding: 10px 65px 10px 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            outline: none; 
        }
        
        .search-counter { 
            position: absolute; 
            right: 10px; 
            font-size: 11px; 
            font-weight: 500; 
            color: var(--text-muted); 
            background: #18181b; 
            padding: 2px 6px; 
            border-radius: 4px; 
            pointer-events: none; 
        }
        
        .search-options { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); }
        .checkbox-label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .checkbox-label input { accent-color: var(--accent-pink); }
        
        /* Редактор */
        .editor-container { 
            flex: 1; 
            position: relative; 
            background-color: var(--bg-color); 
        }
        
        .CodeMirror { 
            position: absolute; 
            top: 0; left: 0; right: 0; bottom: 0; 
            height: 100% !important; 
            background: var(--bg-color) !important; 
            color: #e4e4e7 !important; 
            font-family: 'Courier New', monospace; 
            font-size: 14px; 
        }
        
        .CodeMirror-gutters { 
            background-color: var(--bg-color) !important; 
            border-right: 1px solid var(--border-color) !important; 
        }
        
        .CodeMirror-linenumber { color: #52525b !important; }
        .CodeMirror-cursor { border-left: 2px solid var(--accent-pink) !important; }
        
        /* Подсветка синтаксиса */
        .cm-tag { color: var(--accent-pink) !important; }
        .cm-meta { color: var(--accent-purple) !important; }
        .cm-string { color: #34d399 !important; }
        .cm-word { color: var(--text-color); }
        
        /* Выделение текста в CodeMirror */
        .CodeMirror-selected { 
            background-color: rgba(139, 92, 246, 0.2) !important; 
        }
        .CodeMirror-focused .CodeMirror-selected { 
            background-color: rgba(139, 92, 246, 0.25) !important; 
        }

        /* Мягкая подсветка всех найденных совпадений */
        .cm-search-marker { 
            background-color: rgba(139, 92, 246, 0.12) !important; 
            border: none !important;
        }
        
        /* Текущее активное совпадение: ультра-аккуратное неоновое подчеркивание */
        .cm-search-marker-current { 
            background-color: transparent !important; 
            border: none !important;
            border-bottom: 2px solid var(--accent-pink) !important;
        }

        /* Статусбар */
        .statusbar { 
            background-color: var(--panel-bg); 
            color: var(--text-muted); 
            padding: 6px 16px; 
            font-size: 11px; 
            display: flex; 
            justify-content: space-between; 
            border-top: 1px solid var(--border-color); 
        }
        .statusbar.error { background-color: #7f1d1d; color: #fca5a5; }

        /* Адаптивность под iPhone */
        @media (max-width: 480px) {
            .toolbar { padding: 10px 12px; }
            .filename-group { order: 3; width: 100%; }
            .filename-input { width: 100%; max-width: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="toolbar">
        <div class="btn-group">
            <button class="btn" onclick="document.getElementById('file-input').click()">Открыть</button>
            <input type="file" id="file-input" onchange="handleFileSelect(event)">
        </div>
        
        <div class="btn-group filename-group">
            <input type="text" id="filename-display" class="filename-input" placeholder="Имя файла..." value="patch.plist">
        </div>
        
        <div class="btn-group">
            <button class="btn" onclick="triggerSearch()">Поиск</button>
            <button class="btn btn-primary" onclick="shareBplist()">Поделиться</button>
        </div>
    </div>

    <div class="search-panel" id="custom-search-panel" style="display: none;">
        <div class="search-row">
            <div class="search-input-wrapper">
                <input type="text" id="search-term" class="search-input" placeholder="Найти..." oninput="initSearchContext()">
                <span class="search-counter" id="search-index-label">0/0</span>
            </div>
            <button class="btn" onclick="navigateSearch(false)">↓</button>
            <button class="btn" onclick="navigateSearch(true)">↑</button>
        </div>
        <div class="search-row">
            <input type="text" id="replace-term" class="search-input" placeholder="Заменить на...">
            <button class="btn" onclick="doReplace()">Заменить</button>
            <button class="btn" onclick="doReplaceAll()">Все</button>
        </div>
        <div class="search-options">
            <label class="checkbox-label"><input type="checkbox" id="search-regex" checked onchange="initSearchContext()"> RegExp</label>
            <label class="checkbox-label"><input type="checkbox" id="search-case" onchange="initSearchContext()"> Регистр</label>
        </div>
    </div>

    <div class="editor-container">
        <textarea id="editor"></textarea>
    </div>

    <div class="statusbar" id="statusbar">
        <span id="status-text">Ожидание файла...</span>
        <span>OLED Stable v3.5</span>
    </div>
</div>

<script>
    // [Декодер bplist00]
    const BplistReader = {
        parse: function(buffer) {
            const data = new DataView(buffer);
            const len = buffer.byteLength;
            if (len < 32) throw new Error("Файл слишком мал");
            let header = "";
            for(let i=0; i<8; i++) header += String.fromCharCode(data.getUint8(i));
            if (!header.startsWith("bplist00")) throw new Error("Это не bplist00 формат!");
            const trailerOffset = len - 32;
            const offsetIntSize = data.getUint8(trailerOffset + 6);
            const objectRefSize = data.getUint8(trailerOffset + 7);
            const numObjects = Number(data.getBigUint64(trailerOffset + 8));
            const topObject = Number(data.getBigUint64(trailerOffset + 16));
            const offsetTableOffset = Number(data.getBigUint64(trailerOffset + 24));
            const offsets = [];
            for (let i = 0; i < numObjects; i++) {
                let off = 0;
                const ptr = offsetTableOffset + i * offsetIntSize;
                for (let j = 0; j < offsetIntSize; j++) off = (off << 8) | data.getUint8(ptr + j);
                offsets.push(off);
            }
            function readObject(ref) {
                const offset = offsets[ref];
                const typeByte = data.getUint8(offset);
                const objType = typeByte >> 4;
                let objInfo = typeByte & 0x0F;
                if (objType === 0x0) {
                    if (objInfo === 0x00) return null;
                    if (objInfo === 0x08) return false;
                    if (objInfo === 0x09) return true;
                    return null;
                }
                if (objType === 0x1) {
                    const bytes = 1 << objInfo;
                    let val = 0n;
                    for(let i=0; i<bytes; i++) val = (val << 8n) | BigInt(data.getUint8(offset + 1 + i));
                    return Number(val);
                }
                if (objType === 0x2) {
                    const bytes = 1 << objInfo;
                    if (bytes === 4) return data.getFloat32(offset + 1);
                    if (bytes === 8) return data.getFloat64(offset + 1);
                }
                if (objType === 0x4) {
                    let dataLen = objInfo;
                    let dataOffset = 1;
                    if (objInfo === 0x0F) { const res = readLength(offset + 1); dataLen = res.val; dataOffset += res.bytes; }
                    let out = "";
                    for(let i=0; i<dataLen; i++) out += data.getUint8(offset + dataOffset + i).toString(16).padStart(2, '0');
                    return `{hex_data}:${out}`;
                }
                if (objType === 0x5) {
                    let strLen = objInfo;
                    let strOffset = 1;
                    if (objInfo === 0x0F) { const res = readLength(offset + 1); strLen = res.val; strOffset += res.bytes; }
                    let s = "";
                    for(let i=0; i<strLen; i++) s += String.fromCharCode(data.getUint8(offset + strOffset + i));
                    return s;
                }
                if (objType === 0xA || objType === 0xC) {
                    let arrLen = objInfo;
                    let arrOffset = 1;
                    if (objInfo === 0x0F) { const res = readLength(offset + 1); arrLen = res.val; arrOffset += res.bytes; }
                    const list = [];
                    for(let i=0; i<arrLen; i++) {
                        let refId = 0; const ptr = offset + arrOffset + i * objectRefSize;
                        for(let j=0; j<objectRefSize; j++) refId = (refId << 8) | data.getUint8(ptr + j);
                        list.push(readObject(refId));
                    }
                    return list;
                }
                if (objType === 0xD) {
                    let dictLen = objInfo;
                    let dataOffset = 1; 
                    if (objInfo === 0x0F) { const res = readLength(offset + 1); dictLen = res.val; dataOffset += res.bytes; }
                    const keysRefs = []; const valsRefs = []; let ptr = offset + dataOffset;
                    for(let i=0; i<dictLen; i++) { let r = 0; for(let j=0; j<objectRefSize; j++) r = (r << 8) | data.getUint8(ptr++); keysRefs.push(r); }
                    for(let i=0; i<dictLen; i++) { let r = 0; for(let j=0; j<objectRefSize; j++) r = (r << 8) | data.getUint8(ptr++); valsRefs.push(r); }
                    const dict = {};
                    for(let i=0; i<dictLen; i++) { const key = String(readObject(keysRefs[i])); dict[key] = readObject(valsRefs[i]); }
                    return dict;
                }
                return null;
            }
            function readLength(off) {
                const b = data.getUint8(off);
                if ((b >> 4) === 0x1) {
                    const bytes = 1 << (b & 0x0F); let val = 0;
                    for(let i=0; i<bytes; i++) val = (val << 8) | data.getUint8(off + 1 + i);
                    return { val, bytes: bytes + 1 };
                }
                return { val: b, bytes: 1 };
            }
            return readObject(topObject);
        }
    };

    function objectToXmlPlist(obj) {
        let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n';
        function convert(item, indent = "  ") {
            if (item === null) return indent + '<string></string>\n';
            if (item === true) return indent + '<true/>\n';
            if (item === false) return indent + '<false/>\n';
            if (typeof item === 'number') {
                if (Number.isInteger(item)) return indent + `<integer>${item}</integer>\n`;
                return indent + `<real>${item}</real>\n`;
            }
            if (typeof item === 'string') {
                if (item.startsWith("{hex_data}:")) {
                    const hex = item.replace("{hex_data}:", "");
                    let binary = ''; for (let i = 0; i < hex.length; i += 2) binary += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
                    return indent + `<data>${btoa(binary)}</data>\n`;
                }
                const escaped = item.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                return indent + `<string>${escaped}</string>\n`;
            }
            if (Array.isArray(item)) {
                let res = indent + '<array>\n'; item.forEach(v => { res += convert(v, indent + "  "); });
                return res + indent + '</array>\n';
            }
            if (typeof item === 'object') {
                let res = indent + '<dict>\n';
                for (let key in item) {
                    const escapedKey = key.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    res += indent + `  <key>${escapedKey}</key>\n` + convert(item[key], indent + "  ");
                }
                return res + indent + '</dict>\n';
            }
            return '';
        }
        return xml + convert(obj) + '</plist>';
    }

    function xmlPlistToObject(xmlString) {
        let cleanXml = xmlString.replace(/<!--[\s\S]*?-->/g, "");
        const tokenRegex = /(<[^>]+>|[^<]+)/g;
        const tokens = cleanXml.match(tokenRegex).map(t => t.trim()).filter(t => t.length > 0);
        let index = 0;
        
        function parse() {
            if (index >= tokens.length) return null;
            let token = tokens[index];
            if (token.startsWith("<plist")) { index++; return parse(); }
            if (token === "</plist>") return null;
            if (token === "<true/>" || token === "<true>") { index++; if(token==="<true>") index++; return true; }
            if (token === "<false/>" || token === "<false>") { index++; if(token==="<false>") index++; return false; }
            if (token.startsWith("<integer>")) { index++; let val = parseInt(tokens[index], 10); index += 2; return val; }
            if (token.startsWith("<real>")) { index++; let val = parseFloat(tokens[index]); index += 2; return val; }
            if (token.startsWith("<string>")) {
                index++; let val = "";
                if (!tokens[index].startsWith("</string>")) { val = tokens[index]; index++; }
                index++; return val.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
            }
            if (token.startsWith("<data>")) {
                index++; let val = tokens[index]; index += 2;
                const bin = atob(val.trim()); let hex = "";
                for (let i = 0; i < bin.length; i++) hex += bin.charCodeAt(i).toString(16).padStart(2, '0');
                return `{hex_data}:${hex}`;
            }
            if (token === "<array>") {
                index++; const arr = [];
                while (index < tokens.length && tokens[index] !== "</array>") { arr.push(parse()); }
                index++; return arr;
            }
            if (token === "<dict>") {
                index++; const dict = {};
                while (index < tokens.length && tokens[index] !== "</dict>") {
                    if (tokens[index].startsWith("<key>")) {
                        index++; let key = tokens[index].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'); index += 2;
                        dict[key] = parse();
                    } else { index++; }
                }
                index++; return dict;
            }
            index++; return null;
        }
        while (index < tokens.length && !tokens[index].startsWith("<dict") && !tokens[index].startsWith("<array")) { index++; }
        return parse();
    }

    // [Отказоустойчивый Кодер bplist00]
    const BplistWriter = {
        create: function(obj) {
            const offsetTable = []; 
            const objMap = new Map();
            
            function serialize(item) {
                if (item === null) return writeRawObject([0x00]);
                if (item === false) return writeRawObject([0x08]);
                if (item === true) return writeRawObject([0x09]);
                
                if (typeof item === 'object' || typeof item === 'string') {
                    if (objMap.has(item)) return objMap.get(item);
                }
                
                const currentRef = offsetTable.length;
                if (typeof item === 'object' || typeof item === 'string') {
                    objMap.set(item, currentRef);
                }
                
                if (typeof item === 'number') {
                    if (Number.isInteger(item)) {
                        const buf = new ArrayBuffer(8);
                        new DataView(buf).setBigInt64(0, BigInt(item));
                        offsetTable.push([0x13, ...new Uint8Array(buf)]);
                    } else {
                        const buf = new ArrayBuffer(8);
                        new DataView(buf).setFloat64(0, item);
                        offsetTable.push([0x23, ...new Uint8Array(buf)]);
                    }
                } else if (typeof item === 'string') {
                    if (item.startsWith("{hex_data}:")) {
                        const hex = item.replace("{hex_data}:", "");
                        const bytes = [];
                        for (let c = 0; c < hex.length; c += 2) bytes.push(parseInt(hex.substr(c, 2), 16));
                        writeLengthMarker(0x40, bytes.length, bytes);
                    } else {
                        const encoder = new TextEncoder();
                        const raw = encoder.encode(item);
                        writeLengthMarker(0x50, raw.length, Array.from(raw));
                    }
                } else if (Array.isArray(item)) {
                    const refs = item.map(serialize);
                    writeLengthMarker(0xA0, refs.length, refs);
                } else if (typeof item === 'object') {
                    const keys = Object.keys(item);
                    const kRefs = keys.map(serialize);
                    const vRefs = keys.map(k => serialize(item[k]));
                    writeLengthMarker(0xD0, keys.length, [...kRefs, ...vRefs]);
                }
                return currentRef;
            }

            function writeRawObject(bytes) {
                const ref = offsetTable.length;
                offsetTable.push(bytes);
                return ref;
            }

            function writeLengthMarker(type, length, payload) {
                if (length < 15) {
                    offsetTable.push([type | length, ...payload]);
                } else {
                    let lenBytes = [];
                    if (length <= 0xFF) { lenBytes = [0x10, length]; }
                    else if (length <= 0xFFFF) { lenBytes = [0x11, (length >> 8) & 0xFF, length & 0xFF]; }
                    else { lenBytes = [0x12, (length >> 24) & 0xFF, (length >> 16) & 0xFF, (length >> 8) & 0xFF, length & 0xFF]; }
                    offsetTable.push([type | 0x0F, ...lenBytes, ...payload]);
                }
            }

            serialize(obj);

            const numObjects = offsetTable.length;
            let objectRefSize = 1;
            if (numObjects > 0xFF) objectRefSize = 2;
            if (numObjects > 0xFFFF) objectRefSize = 4;

            for (let i = 0; i < numObjects; i++) {
                const bytes = offsetTable[i];
                const type = bytes[0] & 0xF0;
                if (type === 0xA0 || type === 0xD0) {
                    const headerSize = (bytes[0] & 0x0F) === 0x0F ? (bytes[1] === 0x10 ? 3 : bytes[1] === 0x11 ? 4 : 6) : 1;
                    const meta = bytes.slice(0, headerSize);
                    const oldRefs = bytes.slice(headerSize);
                    const newRefs = [];
                    for (let r of oldRefs) {
                        for (let b = objectRefSize - 1; b >= 0; b--) newRefs.push((r >> (b * 8)) & 0xFF);
                    }
                    offsetTable[i] = [...meta, ...newRefs];
                }
            }

            let finalBytes = [56, 112, 108, 105, 115, 116, 48, 48]; 
            const actualOffsets = [];
            
            offsetTable.forEach(bytes => {
                actualOffsets.push(finalBytes.length);
                finalBytes.push(...bytes);
            });

            const offsetTablePos = finalBytes.length;

            let offsetIntSize = 1;
            if (offsetTablePos > 0xFF) offsetIntSize = 2;
            if (offsetTablePos > 0xFFFF) offsetIntSize = 4;
            if (offsetTablePos > 0xFFFFFFFF) offsetIntSize = 8;

            actualOffsets.forEach(off => {
                for (let b = offsetIntSize - 1; b >= 0; b--) {
                    finalBytes.push((off >> (b * 8)) & 0xFF);
                }
            });

            const trailer = new Array(32).fill(0);
            trailer[6] = offsetIntSize;
            trailer[7] = objectRefSize;
            
            const numObjBig = BigInt(numObjects);
            for(let i=0; i<8; i++) trailer[8+i] = Number((numObjBig >> BigInt((7-i)*8)) & 0xFFn);
            
            const tablePosBig = BigInt(offsetTablePos);
            for(let i=0; i<8; i++) trailer[24+i] = Number((tablePosBig >> BigInt((7-i)*8)) & 0xFFn);

            finalBytes.push(...trailer); 
            return new Uint8Array(finalBytes).buffer;
        }
    };
</script>

<script>
    let editor;
    let searchMatches = [];
    let currentMatchIndex = -1;
    let activeMarkers = [];
    let currentHighlightMark = null;

    window.addEventListener('DOMContentLoaded', () => {
        editor = CodeMirror.fromTextArea(document.getElementById('editor'), {
            mode: "xml",
            lineNumbers: true,
            lineWrapping: true
        });
        
        editor.setValue(`<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0">\n  <dict>\n    <key>Инструкция</key>\n    <string>Нажмите кнопку "Открыть" для загрузки bplist00</string>\n  </dict>\n</plist>`);
        
        editor.on("change", () => {
            if (document.getElementById('custom-search-panel').style.display === 'flex') {
                initSearchContext(false); 
            }
        });
        
        setTimeout(() => { editor.refresh(); }, 200);
    });

    function updateStatus(text, isError = false) {
        const sb = document.getElementById('statusbar');
        document.getElementById('status-text').innerText = text;
        if (isError) sb.classList.add('error'); else sb.classList.remove('error');
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        document.getElementById('filename-display').value = file.name;
        updateStatus("Декодирование...");
        
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const buffer = e.target.result;
                const parsedObj = BplistReader.parse(buffer);
                editor.setValue(objectToXmlPlist(parsedObj));
                updateStatus("Успешно импортировано!");
                resetSearch();
                setTimeout(() => { editor.refresh(); }, 50);
            } catch (err) { 
                updateStatus("Ошибка: " + err.message, true); 
            }
        };
        reader.readAsArrayBuffer(file);
    }

    async function shareBplist() {
        try {
            updateStatus("Сборка bplist00...");
            const xmlText = editor.getValue();
            const obj = xmlPlistToObject(xmlText);
            if (!obj) throw new Error("Невалидная XML структура.");
            
            let targetName = document.getElementById('filename-display').value.trim();
            if (!targetName) targetName = "patched_file.plist";
            
            const buffer = BplistWriter.create(obj);
            const fileData = new Uint8Array(buffer);
            
            const file = new File([fileData], targetName, { type: "application/x-plist" });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: targetName
                });
                updateStatus("Успешно экспортировано!");
            } else {
                const blob = new Blob([buffer], { type: "application/x-plist" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = targetName;
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
                updateStatus("Скачано (Share Sheet недоступен)");
            }
        } catch (err) { 
            updateStatus("Ошибка экспорта", true);
            alert("Ошибка: " + err.message);
        }
    }

    function triggerSearch() {
        const panel = document.getElementById('custom-search-panel');
        if (panel.style.display === 'none') {
            panel.style.display = 'flex';
            document.getElementById('search-term').focus();
            initSearchContext();
        } else {
            panel.style.display = 'none';
            clearMarkers();
        }
        setTimeout(() => { editor.refresh(); }, 50);
    }

    function clearMarkers() {
        activeMarkers.forEach(m => m.clear()); activeMarkers = [];
        if (currentHighlightMark) { currentHighlightMark.clear(); currentHighlightMark = null; }
    }

    function resetSearch() {
        clearMarkers(); searchMatches = []; currentMatchIndex = -1;
        document.getElementById('search-index-label').innerText = "0/0";
    }

    function getSearchQuery() {
        const queryStr = document.getElementById('search-term').value;
        if (!queryStr) return null;

        const isRegex = document.getElementById('search-regex').checked;
        const caseSensitive = document.getElementById('search-case').checked;
        
        if (isRegex) {
            try { return new RegExp(queryStr, caseSensitive ? "g" : "gi"); } catch (e) { return null; }
        }
        return queryStr;
    }

    function initSearchContext(scroll = true) {
        clearMarkers();
        const query = getSearchQuery();
        if (!query) { resetSearch(); return; }

        const caseSensitive = document.getElementById('search-case').checked;
        searchMatches = [];
        let cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, { caseFold: !caseSensitive });
        
        while (cursor.findNext()) {
            const from = cursor.from(); const to = cursor.to();
            searchMatches.push({ from: {line: from.line, ch: from.ch}, to: {line: to.line, ch: to.ch} });
            let marker = editor.markText(from, to, { className: "cm-search-marker" });
            activeMarkers.push(marker);
        }

        if (searchMatches.length > 0) {
            currentMatchIndex = 0; updateCounterUI();
            if (scroll) highlightCurrentMatch();
        } else { resetSearch(); }
    }

    function updateCounterUI() {
        const label = document.getElementById('search-index-label');
        if (searchMatches.length === 0) label.innerText = "0/0";
        else label.innerText = `${currentMatchIndex + 1}/${searchMatches.length}`;
    }

    function highlightCurrentMatch() {
        if (currentHighlightMark) { currentHighlightMark.clear(); currentHighlightMark = null; }
        if (searchMatches.length === 0 || currentMatchIndex === -1) return;
        const match = searchMatches[currentMatchIndex];
        editor.setSelection(match.from, match.to);
        currentHighlightMark = editor.markText(match.from, match.to, { className: "cm-search-marker-current" });
        editor.scrollIntoView({from: match.from, to: match.to}, 150);
    }

    function navigateSearch(reverse = false) {
        if (searchMatches.length === 0) return;
        if (reverse) currentMatchIndex = (currentMatchIndex - 1 + searchMatches.length) % searchMatches.length;
        else currentMatchIndex = (currentMatchIndex + 1) % searchMatches.length;
        updateCounterUI(); highlightCurrentMatch();
    }

    function doReplace() {
        if (searchMatches.length === 0 || currentMatchIndex === -1) return;
        const replaceStr = document.getElementById('replace-term').value;
        
        const match = searchMatches[currentMatchIndex];
        const text = editor.getRange(match.from, match.to);
        const query = getSearchQuery();
        
        const processedReplace = text.replace(query, replaceStr);
        
        editor.replaceSelection(processedReplace);
        initSearchContext(false);
        if (searchMatches.length > 0) {
            if (currentMatchIndex >= searchMatches.length) currentMatchIndex = 0;
            updateCounterUI(); highlightCurrentMatch();
        }
    }

    function doReplaceAll() {
        const query = getSearchQuery();
        if (!query || searchMatches.length === 0) return;
        
        const replaceStr = document.getElementById('replace-term').value;
        const caseSensitive = document.getElementById('search-case').checked;
        
        editor.operation(() => {
            let cursor = editor.getSearchCursor(query, {line: 0, ch: 0}, { caseFold: !caseSensitive });
            while (cursor.findNext()) {
                const text = editor.getRange(cursor.from(), cursor.to());
                const processedReplace = text.replace(query, replaceStr);
                cursor.replace(processedReplace);
            }
        });
        
        updateStatus(`Успешно заменено элементов: ${searchMatches.length}`);
        resetSearch();
    }
</script>
</body>
</html>
