<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Редактор Binary Plist</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e8eb; --dim:#8b93a1; --accent:#5b8cff; --accent2:#7c5bff;
    --ok:#3ecf8e; --warn:#f2a93b; --danger:#ef5a5a; --mono:'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;}
  #app{display:flex;flex-direction:column;height:100vh;}
  header{padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;}
  header h1{font-size:15px;margin:0 0 8px 0;font-weight:600;letter-spacing:.2px;}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .fileRow{margin-bottom:8px;}
  button, .btn{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  button:active{transform:scale(.97);}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:white;font-weight:600;}
  button.small{padding:4px 8px;font-size:12px;border-radius:6px;}
  button.danger{color:var(--danger);border-color:var(--danger);}
  input[type=text], input[type=search]{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);
    border-radius:8px;padding:7px 9px;font-size:13px;font-family:var(--mono);
  }
  #searchInput{flex:1;min-width:120px;}
  label.chk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--dim);user-select:none;}
  #status{font-size:12px;color:var(--dim);margin-top:6px;min-height:16px;}
  #matchInfo{font-size:12px;color:var(--dim);white-space:nowrap;}
  main{flex:1;overflow:auto;padding:10px 8px 80px 8px;}
  #dropzone{
    margin:20px;padding:40px 16px;border:2px dashed var(--border);border-radius:14px;
    text-align:center;color:var(--dim);
  }
  #dropzone.drag{border-color:var(--accent);color:var(--text);}
  .node{margin-left:14px;border-left:1px dashed var(--border);padding-left:8px;position:relative;}
  .node.root{margin-left:0;border-left:none;padding-left:0;}
  .nodeHeader{display:flex;align-items:center;gap:6px;padding:3px 2px;border-radius:6px;flex-wrap:wrap;}
  .nodeHeader.matched{outline:2px solid var(--warn);}
  .nodeHeader.current{outline:2px solid var(--accent);background:rgba(91,140,255,.15);}
  .toggle{width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;
    color:var(--dim);cursor:pointer;font-size:11px;user-select:none;border-radius:4px;}
  .toggle:hover{background:var(--panel2);}
  .keyInput{font-family:var(--mono);font-weight:600;color:#9fc4ff;background:transparent;border:1px solid transparent;
    border-radius:5px;padding:3px 5px;min-width:40px;max-width:160px;}
  .keyInput:focus{background:var(--panel2);border-color:var(--border);}
  .typeTag{font-size:10px;color:var(--dim);background:var(--panel2);border-radius:5px;padding:2px 5px;flex:0 0 auto;}
  .valInput{font-family:var(--mono);background:var(--panel2);border:1px solid var(--border);border-radius:5px;
    padding:4px 6px;color:var(--text);flex:1;min-width:80px;}
  select.typeSelect{font-size:11px;background:var(--panel2);color:var(--dim);border:1px solid var(--border);
    border-radius:5px;padding:2px 3px;flex:0 0 auto;}
  .rowActions{display:flex;gap:3px;flex:0 0 auto;}
  .countTag{font-size:11px;color:var(--dim);}
  .children{margin-top:2px;}
  .children.collapsed{display:none;}
  .addBar{margin:4px 0 4px 18px;display:flex;gap:5px;flex-wrap:wrap;}
  .indexTag{font-family:var(--mono);color:var(--dim);font-size:11px;flex:0 0 22px;text-align:right;}
  footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--border);padding:8px 12px;
    display:flex;gap:8px;z-index:5;}
  footer button{flex:1;}
  ::selection{background:rgba(91,140,255,.4);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🗂 Редактор Binary Plist</h1>
    <div class="row fileRow">
      <input type="file" id="fileInput" style="display:none">
      <button class="btn" id="openBtn">📂 Открыть .plist</button>
      <button class="btn" id="newBtn">➕ Новый (пустой dict)</button>
    </div>
    <div class="row">
      <input type="search" id="searchInput" placeholder="Поиск по ключам и значениям…">
      <label class="chk"><input type="checkbox" id="regexToggle"> Regex</label>
      <label class="chk"><input type="checkbox" id="caseToggle"> Aa</label>
      <button class="small" id="prevBtn">◀</button>
      <button class="small" id="nextBtn">▶</button>
      <span id="matchInfo"></span>
    </div>
    <div id="status"></div>
  </header>

  <main id="main">
    <div id="dropzone">Перетащите сюда .plist файл<br>или нажмите «Открыть .plist»</div>
    <div id="treeRoot"></div>
  </main>

  <footer id="footer" style="display:none">
    <button class="primary" id="exportBtn">⬇️ Экспорт .plist</button>
    <button id="exportXmlBtn">⬇️ Экспорт как XML</button>
  </footer>
</div>

<script>
'use strict';

/* =========================================================
   1. BINARY PLIST PARSER / WRITER
   ========================================================= */
function bytesToUIntNumber(arr){let r=0;for(let i=0;i<arr.length;i++)r=r*256+arr[i];return r;}
function bytesToBigIntUnsigned(arr){let r=0n;for(let i=0;i<arr.length;i++)r=(r<<8n)|BigInt(arr[i]);return r;}
function bytesToBigIntSigned(arr){let v=bytesToBigIntUnsigned(arr);const bits=BigInt(arr.length*8);const max=1n<<(bits-1n);if(v>=max)v-=(1n<<bits);return v;}
function bytesToBase64(bytes){let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function base64ToBytes(b64){const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
const EPOCH_OFFSET=978307200;

function parseBinaryPlist(bytes){
  if(bytes.length<40) throw new Error('Файл слишком мал для binary plist');
  const headerStr=String.fromCharCode(...bytes.slice(0,6));
  if(headerStr!=='bplist') throw new Error('Это не binary plist (нет заголовка bplist00). Поддерживаются только бинарные .plist.');

  const trailer=bytes.slice(bytes.length-32);
  const offsetIntSize=trailer[6];
  const objectRefSize=trailer[7];
  const numObjects=Number(bytesToBigIntUnsigned(trailer.slice(8,16)));
  const topObject=Number(bytesToBigIntUnsigned(trailer.slice(16,24)));
  const offsetTableOffset=Number(bytesToBigIntUnsigned(trailer.slice(24,32)));

  const offsetTable=[];
  for(let i=0;i<numObjects;i++){
    const start=offsetTableOffset+i*offsetIntSize;
    offsetTable.push(bytesToUIntNumber(bytes.slice(start,start+offsetIntSize)));
  }
  const cache=new Array(numObjects);

  function readLen(pos,info){
    if(info!==0x0F) return [info,pos];
    const lenMarker=bytes[pos]; pos++;
    const lenByteCount=1<<(lenMarker&0x0F);
    const len=bytesToUIntNumber(bytes.slice(pos,pos+lenByteCount));
    pos+=lenByteCount;
    return [len,pos];
  }

  function readObject(index){
    if(cache[index]!==undefined) return cache[index];
    const offset=offsetTable[index];
    const marker=bytes[offset];
    const type=marker&0xF0, info=marker&0x0F;
    let pos=offset+1, result;
    switch(type){
      case 0x00:
        if(marker===0x00) result=null;
        else if(marker===0x08) result=false;
        else if(marker===0x09) result=true;
        else result=null;
        cache[index]=result; return result;
      case 0x10:{
        const byteCount=1<<info;
        const arr=bytes.slice(pos,pos+byteCount);
        let val;
        if(byteCount>=8){
          const big=bytesToBigIntSigned(arr.slice(0,8));
          val=(big>=BigInt(Number.MIN_SAFE_INTEGER)&&big<=BigInt(Number.MAX_SAFE_INTEGER))?Number(big):big.toString();
        } else val=bytesToUIntNumber(arr);
        result={t:'int',v:val}; cache[index]=result; return result;
      }
      case 0x20:{
        const byteCount=1<<info;
        const arr=bytes.slice(pos,pos+byteCount);
        const dv=new DataView(arr.buffer,arr.byteOffset,arr.byteLength);
        const val=byteCount===4?dv.getFloat32(0,false):dv.getFloat64(0,false);
        result={t:'real',v:val}; cache[index]=result; return result;
      }
      case 0x30:{
        const arr=bytes.slice(pos,pos+8);
        const dv=new DataView(arr.buffer,arr.byteOffset,8);
        const secs=dv.getFloat64(0,false);
        const date=new Date((secs+EPOCH_OFFSET)*1000);
        result={t:'date',v:date.toISOString()}; cache[index]=result; return result;
      }
      case 0x40:{
        const [len,p2]=readLen(pos,info);
        const dataBytes=bytes.slice(p2,p2+len);
        result={t:'data',v:bytesToBase64(dataBytes)}; cache[index]=result; return result;
      }
      case 0x50:{
        const [len,p2]=readLen(pos,info);
        const strBytes=bytes.slice(p2,p2+len);
        let s=''; for(let i=0;i<strBytes.length;i++) s+=String.fromCharCode(strBytes[i]);
        result=s; cache[index]=result; return result;
      }
      case 0x60:{
        const [len,p2]=readLen(pos,info);
        let chars=[];
        for(let i=0;i<len;i++){ const hi=bytes[p2+i*2], lo=bytes[p2+i*2+1]; chars.push((hi<<8)|lo); }
        result=String.fromCharCode(...chars); cache[index]=result; return result;
      }
      case 0x80:{
        const byteCount=info+1;
        const val=bytesToUIntNumber(bytes.slice(pos,pos+byteCount));
        result={t:'uid',v:val}; cache[index]=result; return result;
      }
      case 0xA0:{
        const [len,p2]=readLen(pos,info);
        const refs=[]; let p=p2;
        for(let i=0;i<len;i++){ refs.push(bytesToUIntNumber(bytes.slice(p,p+objectRefSize))); p+=objectRefSize; }
        result=new Array(len); cache[index]=result;
        for(let i=0;i<len;i++) result[i]=readObject(refs[i]);
        return result;
      }
      case 0xD0:{
        const [len,p2]=readLen(pos,info);
        const keyRefs=[], valRefs=[]; let p=p2;
        for(let i=0;i<len;i++){ keyRefs.push(bytesToUIntNumber(bytes.slice(p,p+objectRefSize))); p+=objectRefSize; }
        for(let i=0;i<len;i++){ valRefs.push(bytesToUIntNumber(bytes.slice(p,p+objectRefSize))); p+=objectRefSize; }
        const obj={__dict:true,__keys:[],__map:{}};
        cache[index]=obj;
        for(let i=0;i<len;i++){
          const k=readObject(keyRefs[i]);
          const v=readObject(valRefs[i]);
          obj.__keys.push(k); obj.__map[k]=v;
        }
        return obj;
      }
      default: result=null; cache[index]=result; return result;
    }
  }
  return readObject(topObject);
}

class ByteBuf{
  constructor(){this.chunks=[];this.length=0;}
  pushByte(b){this.chunks.push(Uint8Array.of(b&0xFF));this.length+=1;}
  pushBytes(arr){this.chunks.push(Uint8Array.from(arr));this.length+=arr.length;}
  toUint8Array(){const out=new Uint8Array(this.length);let off=0;for(const c of this.chunks){out.set(c,off);off+=c.length;}return out;}
}
function uintToBytesBE(value,size){
  let big=typeof value==='bigint'?value:BigInt(Math.trunc(Number(value)));
  if(big<0n) big=(1n<<BigInt(size*8))+big;
  const out=new Array(size);
  for(let i=size-1;i>=0;i--){ out[i]=Number(big&0xFFn); big>>=8n; }
  return out;
}
function intSizeFor(value){
  const v=typeof value==='bigint'?value:BigInt(Math.trunc(Number(value)));
  if(v<0n) return 8;
  if(v<=0xFFn) return 1;
  if(v<=0xFFFFn) return 2;
  if(v<=0xFFFFFFFFn) return 4;
  return 8;
}
function writeIntObject(buf,value){
  const size=intSizeFor(value);
  const pow={1:0,2:1,4:2,8:3}[size];
  buf.pushByte(0x10|pow);
  buf.pushBytes(uintToBytesBE(value,size));
}
function writeLenPrefix(buf,baseNibble,length){
  if(length<15) buf.pushByte(baseNibble|length);
  else { buf.pushByte(baseNibble|0x0F); writeIntObject(buf,length); }
}
function isAscii(str){ for(let i=0;i<str.length;i++) if(str.charCodeAt(i)>127) return false; return true; }

function flattenTree(root){
  const objects=[];
  function visit(node){
    const idx=objects.length;
    if(node&&node.__dict){
      const entry={type:'dict',keys:[],vals:[]}; objects.push(entry);
      for(const k of node.__keys){
        const kIdx=visit(k); const vIdx=visit(node.__map[k]);
        entry.keys.push(kIdx); entry.vals.push(vIdx);
      }
      return idx;
    }
    if(Array.isArray(node)){
      const entry={type:'array',items:[]}; objects.push(entry);
      for(const item of node) entry.items.push(visit(item));
      return idx;
    }
    if(node===null||node===undefined){ objects.push({type:'null'}); return idx; }
    if(typeof node==='boolean'){ objects.push({type:'bool',value:node}); return idx; }
    if(typeof node==='string'){ objects.push({type:'string',value:node}); return idx; }
    if(node&&node.t==='int'){ objects.push({type:'int',value:node.v}); return idx; }
    if(node&&node.t==='real'){ objects.push({type:'real',value:node.v}); return idx; }
    if(node&&node.t==='date'){ objects.push({type:'date',value:node.v}); return idx; }
    if(node&&node.t==='data'){ objects.push({type:'data',value:node.v}); return idx; }
    if(node&&node.t==='uid'){ objects.push({type:'uid',value:node.v}); return idx; }
    objects.push({type:'string',value:String(node)}); return idx;
  }
  const rootIdx=visit(root);
  return {objects,rootIdx};
}

function writeBinaryPlist(root){
  const {objects,rootIdx}=flattenTree(root);
  const numObjects=objects.length;
  const objectRefSize=numObjects<=0xFF?1:numObjects<=0xFFFF?2:4;
  const buf=new ByteBuf();
  buf.pushBytes([0x62,0x70,0x6C,0x69,0x73,0x74,0x30,0x30]);
  const offsets=new Array(numObjects);
  for(let i=0;i<numObjects;i++){
    offsets[i]=buf.length;
    const entry=objects[i];
    switch(entry.type){
      case 'null': buf.pushByte(0x00); break;
      case 'bool': buf.pushByte(entry.value?0x09:0x08); break;
      case 'int': writeIntObject(buf,entry.value); break;
      case 'real':{
        buf.pushByte(0x23);
        const tmp=new DataView(new ArrayBuffer(8)); tmp.setFloat64(0,entry.value,false);
        buf.pushBytes(Array.from(new Uint8Array(tmp.buffer))); break;
      }
      case 'date':{
        buf.pushByte(0x33);
        const secs=new Date(entry.value).getTime()/1000-EPOCH_OFFSET;
        const tmp=new DataView(new ArrayBuffer(8)); tmp.setFloat64(0,secs,false);
        buf.pushBytes(Array.from(new Uint8Array(tmp.buffer))); break;
      }
      case 'data':{
        const bytes=base64ToBytes(entry.value);
        writeLenPrefix(buf,0x40,bytes.length);
        buf.pushBytes(Array.from(bytes)); break;
      }
      case 'string':{
        if(isAscii(entry.value)){
          writeLenPrefix(buf,0x50,entry.value.length);
          const arr=[]; for(let i2=0;i2<entry.value.length;i2++) arr.push(entry.value.charCodeAt(i2));
          buf.pushBytes(arr);
        } else {
          writeLenPrefix(buf,0x60,entry.value.length);
          const arr=[];
          for(let i2=0;i2<entry.value.length;i2++){ const c=entry.value.charCodeAt(i2); arr.push((c>>8)&0xFF,c&0xFF); }
          buf.pushBytes(arr);
        }
        break;
      }
      case 'uid':{
        const size=intSizeFor(entry.value);
        buf.pushByte(0x80|(size-1));
        buf.pushBytes(uintToBytesBE(entry.value,size)); break;
      }
      case 'array':{
        writeLenPrefix(buf,0xA0,entry.items.length);
        for(const refIdx of entry.items) buf.pushBytes(uintToBytesBE(refIdx,objectRefSize));
        break;
      }
      case 'dict':{
        writeLenPrefix(buf,0xD0,entry.keys.length);
        for(const refIdx of entry.keys) buf.pushBytes(uintToBytesBE(refIdx,objectRefSize));
        for(const refIdx of entry.vals) buf.pushBytes(uintToBytesBE(refIdx,objectRefSize));
        break;
      }
    }
  }
  const offsetTableOffset=buf.length;
  const maxOffset=Math.max(offsetTableOffset,...offsets,0);
  const offsetIntSize=maxOffset<=0xFF?1:maxOffset<=0xFFFF?2:maxOffset<=0xFFFFFFFF?4:8;
  for(let i=0;i<numObjects;i++) buf.pushBytes(uintToBytesBE(offsets[i],offsetIntSize));
  buf.pushBytes([0,0,0,0,0,0]);
  buf.pushByte(0);
  buf.pushByte(offsetIntSize);
  buf.pushByte(objectRefSize);
  buf.pushBytes(uintToBytesBE(numObjects,8));
  buf.pushBytes(uintToBytesBE(rootIdx,8));
  buf.pushBytes(uintToBytesBE(offsetTableOffset,8));
  return buf.toUint8Array();
}

function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toXml(node,indent){
  const pad='  '.repeat(indent);
  if(node&&node.__dict){
    let out=pad+'<dict>\n';
    for(const k of node.__keys){
      out+=pad+'  <key>'+xmlEscape(k)+'</key>\n';
      out+=toXml(node.__map[k],indent+1);
    }
    out+=pad+'</dict>\n';
    return out;
  }
  if(Array.isArray(node)){
    let out=pad+'<array>\n';
    for(const it of node) out+=toXml(it,indent+1);
    out+=pad+'</array>\n';
    return out;
  }
  if(node===null||node===undefined) return pad+'<string></string>\n';
  if(typeof node==='boolean') return pad+(node?'<true/>':'<false/>')+'\n';
  if(typeof node==='string') return pad+'<string>'+xmlEscape(node)+'</string>\n';
  if(node.t==='int') return pad+'<integer>'+node.v+'</integer>\n';
  if(node.t==='real') return pad+'<real>'+node.v+'</real>\n';
  if(node.t==='date') return pad+'<date>'+node.v.replace(/\.\d+Z$/,'Z')+'</date>\n';
  if(node.t==='data') return pad+'<data>\n'+pad+node.v+'\n'+pad+'</data>\n';
  if(node.t==='uid') return pad+'<integer>'+node.v+'</integer>\n';
  return pad+'<string></string>\n';
}

/* =========================================================
   2. APP STATE + UI
   ========================================================= */
let root=null;
let originalName='edited';
const $=(id)=>document.getElementById(id);
const treeRoot=$('treeRoot');
const statusEl=$('status');
const dropzone=$('dropzone');
const footer=$('footer');

function setStatus(msg,isErr){ statusEl.textContent=msg||''; statusEl.style.color=isErr?'var(--danger)':'var(--dim)'; }

function typeLabel(node){
  if(node===null||node===undefined) return 'null';
  if(node&&node.__dict) return 'dict';
  if(Array.isArray(node)) return 'array';
  if(typeof node==='boolean') return 'bool';
  if(typeof node==='string') return 'string';
  if(node&&node.t) return node.t;
  return 'string';
}

function defaultForType(t){
  switch(t){
    case 'dict': return {__dict:true,__keys:[],__map:{}};
    case 'array': return [];
    case 'string': return '';
    case 'bool': return false;
    case 'null': return null;
    case 'int': return {t:'int',v:0};
    case 'real': return {t:'real',v:0};
    case 'date': return {t:'date',v:new Date().toISOString()};
    case 'data': return {t:'data',v:''};
    case 'uid': return {t:'uid',v:0};
  }
  return '';
}

function rerender(){
  treeRoot.innerHTML='';
  if(root===null){
    footer.style.display='none';
    dropzone.style.display='block';
    return;
  }
  dropzone.style.display='none';
  footer.style.display='flex';
  const el=renderNode(root,null,null,null,'root');
  el.classList.add('root');
  treeRoot.appendChild(el);
  refreshSearch();
}

function renderNode(node, keyOrIndex, parent, setter, pathId){
  const wrap=document.createElement('div');
  wrap.className='node';
  wrap.dataset.path=pathId;

  const header=document.createElement('div');
  header.className='nodeHeader';
  wrap.appendChild(header);

  const type=typeLabel(node);
  const isContainer = type==='dict' || type==='array';

  if(isContainer){
    const toggle=document.createElement('div');
    toggle.className='toggle';
    toggle.textContent='▾';
    header.appendChild(toggle);
    var childrenBox=document.createElement('div');
    childrenBox.className='children';
    toggle.addEventListener('click',()=>{
      childrenBox.classList.toggle('collapsed');
      toggle.textContent=childrenBox.classList.contains('collapsed')?'▸':'▾';
    });
  } else {
    const spacer=document.createElement('div');
    spacer.className='toggle';
    header.appendChild(spacer);
  }

  if(keyOrIndex!==null && typeof keyOrIndex==='number'){
    const idxTag=document.createElement('span');
    idxTag.className='indexTag';
    idxTag.textContent='['+keyOrIndex+']';
    header.appendChild(idxTag);
  } else if(keyOrIndex!==null){
    const keyInput=document.createElement('input');
    keyInput.className='keyInput searchable';
    keyInput.dataset.role='key';
    keyInput.value=keyOrIndex;
    keyInput.addEventListener('change',()=>{
      const dictObj=parent;
      const oldKey=keyOrIndex;
      const newKey=keyInput.value;
      if(newKey===oldKey) return;
      if(dictObj.__map.hasOwnProperty(newKey)){
        setStatus('Ключ "'+newKey+'" уже существует',true);
        keyInput.value=oldKey; return;
      }
      const idx=dictObj.__keys.indexOf(oldKey);
      dictObj.__keys[idx]=newKey;
      dictObj.__map[newKey]=dictObj.__map[oldKey];
      delete dictObj.__map[oldKey];
      rerender();
    });
    header.appendChild(keyInput);
  }

  const typeSelect=document.createElement('select');
  typeSelect.className='typeSelect';
  ['dict','array','string','int','real','bool','date','data','uid','null'].forEach(t=>{
    const opt=document.createElement('option'); opt.value=t; opt.textContent=t;
    if(t===type) opt.selected=true;
    typeSelect.appendChild(opt);
  });
  typeSelect.addEventListener('change',()=>{
    const newVal=defaultForType(typeSelect.value);
    setter(newVal);
    rerender();
  });
  header.appendChild(typeSelect);

  if(!isContainer){
    if(type==='bool'){
      const b=document.createElement('button');
      b.className='small valInput';
      b.style.flex='0 0 auto';
      b.textContent=node?'true':'false';
      b.addEventListener('click',()=>{ setter(!node); rerender(); });
      header.appendChild(b);
    } else if(type==='null'){
      const tag=document.createElement('span');
      tag.className='typeTag'; tag.textContent='null';
      header.appendChild(tag);
    } else {
      const input=document.createElement('input');
      input.type='text';
      input.className='valInput searchable';
      input.dataset.role='value';
      let rawVal;
      if(type==='string') rawVal=node;
      else if(node&&node.t) rawVal=String(node.v);
      else rawVal='';
      input.value=rawVal;
      input.addEventListener('change',()=>{
        let newVal;
        if(type==='string') newVal=input.value;
        else if(type==='int') newVal={t:'int',v:parseIntSafe(input.value)};
        else if(type==='real') newVal={t:'real',v:parseFloat(input.value)||0};
        else if(type==='date') newVal={t:'date',v:input.value};
        else if(type==='data') newVal={t:'data',v:input.value};
        else if(type==='uid') newVal={t:'uid',v:parseIntSafe(input.value)};
        else newVal=input.value;
        setter(newVal);
      });
      header.appendChild(input);
      if(type==='data'){
        const hint=document.createElement('span');
        hint.className='typeTag'; hint.textContent='base64';
        header.appendChild(hint);
      }
      if(type==='date'){
        const hint=document.createElement('span');
        hint.className='typeTag'; hint.textContent='ISO 8601';
        header.appendChild(hint);
      }
    }
  } else {
    const count=type==='dict'?node.__keys.length:node.length;
    const countTag=document.createElement('span');
    countTag.className='countTag';
    countTag.textContent=type==='dict'?count+' ключ(ей)':count+' элемент(ов)';
    header.appendChild(countTag);
  }

  const actions=document.createElement('div');
  actions.className='rowActions';
  if(parent!==null){
    const delBtn=document.createElement('button');
    delBtn.className='small danger';
    delBtn.textContent='✕';
    delBtn.addEventListener('click',()=>{
      if(Array.isArray(parent)){
        const idx=parent.indexOf(node);
        parent.splice(idx,1);
      } else if(parent&&parent.__dict){
        const idx=parent.__keys.indexOf(keyOrIndex);
        parent.__keys.splice(idx,1);
        delete parent.__map[keyOrIndex];
      }
      rerender();
    });
    actions.appendChild(delBtn);
  }
  header.appendChild(actions);

  if(isContainer){
    wrap.appendChild(childrenBox);
    if(type==='dict'){
      node.__keys.forEach((k,i)=>{
        const childEl=renderNode(node.__map[k], k, node, (v)=>{ node.__map[k]=v; }, pathId+'/'+k);
        childrenBox.appendChild(childEl);
      });
    } else {
      node.forEach((item,i)=>{
        const childEl=renderNode(item, i, node, (v)=>{ node[i]=v; }, pathId+'/'+i);
        childrenBox.appendChild(childEl);
      });
    }
    const addBar=document.createElement('div');
    addBar.className='addBar';
    if(type==='dict'){
      const keyInput=document.createElement('input');
      keyInput.type='text'; keyInput.placeholder='новый ключ';
      keyInput.style.cssText='font-family:var(--mono);font-size:12px;padding:5px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--text);width:110px;';
      const addBtn=document.createElement('button');
      addBtn.className='small'; addBtn.textContent='+ добавить';
      addBtn.addEventListener('click',()=>{
        const k=keyInput.value.trim();
        if(!k){ setStatus('Введите имя ключа',true); return; }
        if(node.__map.hasOwnProperty(k)){ setStatus('Ключ уже существует',true); return; }
        node.__keys.push(k);
        node.__map[k]='';
        rerender();
      });
      addBar.appendChild(keyInput); addBar.appendChild(addBtn);
    } else {
      const addBtn=document.createElement('button');
      addBtn.className='small'; addBtn.textContent='+ добавить элемент';
      addBtn.addEventListener('click',()=>{ node.push(''); rerender(); });
      addBar.appendChild(addBtn);
    }
    wrap.appendChild(addBar);
  }

  return wrap;
}

function parseIntSafe(s){
  const n=Number(s);
  if(Number.isFinite(n)) return Math.trunc(n);
  try{ return BigInt(s); }catch(e){ return 0; }
}

/* =========================================================
   3. FILE OPEN / EXPORT (с диалогом «Сохранить как...»)
   ========================================================= */
$('openBtn').addEventListener('click', () => {
  const fi = $('fileInput');
  fi.removeAttribute('accept');
  fi.click();
});

$('fileInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) loadFile(f);
  e.target.value = '';
});

$('newBtn').addEventListener('click', () => {
  root = { __dict: true, __keys: [], __map: {} };
  originalName = 'new';
  setStatus('Создан новый пустой plist');
  rerender();
});

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault(); dropzone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});

function loadFile(file) {
  originalName = file.name.replace(/\.(plist|xml)$/i, '');
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const bytes = new Uint8Array(reader.result);
      root = parseBinaryPlist(bytes);
      setStatus('Загружено: ' + file.name + ' (' + bytes.length + ' байт)');
      rerender();
    } catch (err) {
      setStatus('Ошибка: ' + err.message, true);
    }
  };
  reader.onerror = () => setStatus('Не удалось прочитать файл', true);
  reader.readAsArrayBuffer(file);
}

// Экспорт .plist (Бинарный)
$('exportBtn').addEventListener('click', async () => {
  if (root === null) { setStatus('Нечего экспортировать', true); return; }
  try {
    const out = writeBinaryPlist(root);
    const blob = new Blob([out], { type: 'application/x-plist' });
    const fileName = originalName + '-edited.plist';
    
    await saveFileWithPicker(blob, fileName, [
      {
        description: 'Property List File',
        accept: { 'application/x-plist': ['.plist'] }
      }
    ]);
  } catch (err) {
    if (err.name !== 'AbortError') {
      setStatus('Ошибка экспорта: ' + err.message, true);
    }
  }
});

// Экспорт XML plist
$('exportXmlBtn').addEventListener('click', async () => {
  if (root === null) { setStatus('Нечего экспортировать', true); return; }
  try {
    const xml = '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n' + toXml(root, 0) + '</plist>\n';
    const blob = new Blob([xml], { type: 'application/xml' });
    const fileName = originalName + '-edited.xml.plist';

    await saveFileWithPicker(blob, fileName, [
      {
        description: 'XML Property List',
        accept: { 'application/xml': ['.plist', '.xml'] }
      }
    ]);
  } catch (err) {
    if (err.name !== 'AbortError') {
      setStatus('Ошибка экспорта: ' + err.message, true);
    }
  }
});

// Диалоговое окно сохранения системного проводника
async function saveFileWithPicker(blob, suggestedName, types) {
  if ('showSaveFilePicker' in window) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggestedName,
        types: types
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      setStatus('Файл сохранен: ' + handle.name);
      return;
    } catch (err) {
      if (err.name === 'AbortError') {
        setStatus('Сохранение отменено пользователем');
        throw err;
      }
    }
  }

  // Резервный вариант для мобильных и браузеров без API
  downloadFallback(blob, suggestedName);
}

function downloadFallback(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.target = '_blank';
  document.body.appendChild(a);
  a.click();
  
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 2000);
  
  setStatus('Запрос на скачивание отправлен: ' + filename);
}

/* =========================================================
   4. SEARCH (plain string + regex)
   ========================================================= */
let matches=[]; let matchIndex=-1;
const searchInput=$('searchInput');
const regexToggle=$('regexToggle');
const caseToggle=$('caseToggle');
const matchInfo=$('matchInfo');

function refreshSearch(){
  const q=searchInput.value;
  clearHighlights();
  matches=[]; matchIndex=-1;
  if(!q){ matchInfo.textContent=''; return; }

  let tester;
  if(regexToggle.checked){
    try{
      const re=new RegExp(q, caseToggle.checked ? '' : 'i');
      tester=(s)=>re.test(s);
    }catch(err){
      matchInfo.textContent='Некорр. regex';
      return;
    }
  } else {
    const needle=caseToggle.checked?q:q.toLowerCase();
    tester=(s)=>(caseToggle.checked?s:s.toLowerCase()).includes(needle);
  }

  const els=treeRoot.querySelectorAll('.searchable');
  els.forEach(el=>{
    const val = el.tagName==='INPUT' ? el.value : el.textContent;
    if(val!==undefined && tester(String(val))){
      matches.push(el);
      el.closest('.nodeHeader').classList.add('matched');
    }
  });
  matchInfo.textContent = matches.length ? '0/'+matches.length : 'нет совпадений';
  if(matches.length){ matchIndex=0; gotoMatch(0); }
}

function clearHighlights(){
  treeRoot.querySelectorAll('.nodeHeader.matched').forEach(el=>el.classList.remove('matched'));
  treeRoot.querySelectorAll('.nodeHeader.current').forEach(el=>el.classList.remove('current'));
}

function gotoMatch(i){
  if(!matches.length) return;
  treeRoot.querySelectorAll('.nodeHeader.current').forEach(el=>el.classList.remove('current'));
  matchIndex=((i%matches.length)+matches.length)%matches.length;
  const el=matches[matchIndex];
  let node=el.closest('.node');
  while(node){
    const childrenBox=node.parentElement && node.parentElement.classList && node.parentElement.classList.contains('children') ? node.parentElement : null;
    if(childrenBox){
      childrenBox.classList.remove('collapsed');
    }
    node=node.parentElement ? node.parentElement.closest('.node') : null;
  }
  let p=el.closest('.children');
  while(p){
    p.classList.remove('collapsed');
    const headerToggle = p.previousElementSibling ? p.previousElementSibling.querySelector('.toggle') : null;
    if(headerToggle) headerToggle.textContent='▾';
    const outerNode=p.parentElement.closest('.node');
    p = outerNode ? outerNode.parentElement.closest('.children') : null;
  }
  el.closest('.nodeHeader').classList.add('current');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  matchInfo.textContent=(matchIndex+1)+'/'+matches.length;
}

searchInput.addEventListener('input',debounce(refreshSearch,250));
regexToggle.addEventListener('change',refreshSearch);
caseToggle.addEventListener('change',refreshSearch);
$('nextBtn').addEventListener('click',()=>gotoMatch(matchIndex+1));
$('prevBtn').addEventListener('click',()=>gotoMatch(matchIndex-1));
searchInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter') gotoMatch(matchIndex+1); });

function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

rerender();
</script>
